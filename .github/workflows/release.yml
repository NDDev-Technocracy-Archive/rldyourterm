name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: true
        default: "main"
        type: string
      tag:
        description: "Release tag name (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: "5"
  CARGO_INCREMENTAL: "0"
  CI_RUST_TOOLCHAIN: "1.94.0"
  MSRV_RUST_TOOLCHAIN: "1.92.0"

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Validate ref/tag integrity
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"

          if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid release tag: '$INPUT_TAG'" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "refs/tags/$INPUT_TAG")"
            if [ "$tag_sha" != "$resolved_sha" ]; then
              echo "tag '$INPUT_TAG' points to $tag_sha but selected ref resolves to $resolved_sha" >&2
              exit 1
            fi
          fi

          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: clippy,rustfmt
          shared-key: release-preflight-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - name: Quality gates
        run: |
          rustup toolchain install "${MSRV_RUST_TOOLCHAIN}" --profile minimal
          bash scripts/ci/run_terminal_system_suite.sh \
            target/terminal-benchmark/release-system-suite.json \
            --benchmark-report target/terminal-benchmark/release-benchmark-report.json \
            --governance-mode release
      - name: Upload validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-validation
          path: target/terminal-benchmark/*.json
      - name: Install security gate tools
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
        with:
          bins: cargo-audit,cargo-deny
      - name: Security gates
        run: |
          cargo audit
          cargo deny check bans licenses advisories sources
      - name: Compatibility gate
        run: bash scripts/mvp/run_matrix.sh 3
      - name: VSA governance validation
        run: bash scripts/ci/run_e2e_governance.sh --mode release

  plan:
    name: Plan Release
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: release-plan-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - name: Install cargo-dist
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
        with:
          bins: cargo-dist
      - name: Generate dist plan
        run: cargo dist plan --output-format=json > dist-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-plan
          path: dist-plan.json

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          shared-key: release-build-${{ runner.os }}-${{ matrix.target }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: "false"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p rldyourterm-app
      - name: Package
        run: |
          mkdir -p release
          cd target/${{ matrix.target }}/release
          tar -czf ../../../release/rldyourterm-${{ matrix.target }}.tar.gz rldyourterm-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rldyourterm-${{ matrix.target }}
          path: release/
          compression-level: 0

  publish:
    name: Publish Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: rldyourterm-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.2.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.resolved_sha }}
          files: artifacts/*
          generate_release_notes: true

name: Security

# Source security checks, as the repository's own jobs.
#
# This file used to call NDDev-it-com/ci-workflows reusable workflows, a
# retired library; every run failed before starting. The jobs below restore the
# direct CodeQL, Scorecard, Dependency Review and ClusterFuzzLite workflows the
# repository ran before that migration (commit 47a5256^), with current pins.
# The job names keep the historical check contexts.
#
# The weekly schedules are dropped for this archived project, as for soak.yml;
# batch fuzzing stays available on demand in fuzzing-batch.yml.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: '5'
  CARGO_INCREMENTAL: '0'
  CI_RUST_TOOLCHAIN: 1.94.0
  # Keep CodeQL metric drift fail-closed while allowing known benign generated warnings.
  CODEQL_MAX_EXTRACTED_WITH_ERRORS: '5'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          queries: security-and-quality

      - uses: ./.github/actions/setup-rust-ci # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          shared-key: ci-${{ runner.os }}-${{ env.CI_RUST_TOOLCHAIN }}
          save-if: 'false'

      - name: Build
        run: cargo build --workspace --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust

      - name: Collect Rust extraction diagnostics
        if: ${{ always() }}
        run: bash scripts/ci/codeql_collect_rust_diagnostics.sh codeql-rust-diagnostics

      - name: Upload Rust extraction diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-rust-diagnostics-${{ github.run_id }}
          path: codeql-rust-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Publish extraction diagnostics summary
        if: ${{ always() }}
        run: |
          if [ -f codeql-rust-diagnostics/summary.md ]; then
            cat codeql-rust-diagnostics/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CodeQL diagnostics summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce actionable extraction diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status_file="codeql-rust-diagnostics/status.env"
          if [ ! -f "${status_file}" ]; then
            echo "::error::CodeQL diagnostics status file is missing; enforcement cannot continue."
            exit 1
          fi
          # shellcheck source=/dev/null
          source "${status_file}"
          errors="${CODEQL_EXTRACTION_ERROR_ROWS:-0}"
          actionable="${CODEQL_ACTIONABLE_EXTRACTION_WARNING_ROWS:-0}"
          extracted_with_errors_metric="${CODEQL_EXTRACTED_WITH_ERRORS_METRIC:-0}"
          extracted_with_errors_budget="${CODEQL_MAX_EXTRACTED_WITH_ERRORS:-0}"
          for value in "${errors}" "${actionable}" "${extracted_with_errors_metric}" "${extracted_with_errors_budget}"; do
            case "${value}" in
              ''|*[!0-9]*)
                echo "::error::Invalid CodeQL diagnostics value '${value}' in ${status_file} or the workflow env."
                exit 1
                ;;
            esac
          done
          echo "CodeQL extraction diagnostics enforcement: errors=${errors}, actionable_warnings=${actionable}, extracted_with_errors_metric=${extracted_with_errors_metric}, extracted_with_errors_budget=${extracted_with_errors_budget}"
          if [ "${errors}" -gt 0 ] || [ "${actionable}" -gt 0 ]; then
            echo "::error::Actionable CodeQL extraction diagnostics detected."
            exit 1
          fi
          if [ "${extracted_with_errors_metric}" -gt "${extracted_with_errors_budget}" ]; then
            echo "::error::CodeQL extracted-with-errors metric (${extracted_with_errors_metric}) exceeded budget (${extracted_with_errors_budget})."
            exit 1
          fi

  scorecard:
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Results are not published to the OpenSSF API; the SARIF goes to code
      # scanning only.
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Normalize non-URI placeholder artifact paths
        run: |
          jq '
            (.runs[]?.results[]?.locations[]?.physicalLocation?.artifactLocation?.uri) |=
              (if . == "no file associated with this alert"
               then "no-file-associated-with-this-alert"
               else .
               end)
          ' results.sarif > results.normalized.sarif

      - name: Filter non-actionable maturity checks from SARIF
        run: |
          jq '
            .runs |= map(
              .results |= map(
                select(.ruleId != "MaintainedID")
                | select(.ruleId != "CodeReviewID")
                | select(.ruleId != "CIIBestPracticesID")
              )
              | (.tool.driver.rules |= ((. // []) | map(
                  select(.id != "MaintainedID")
                  | select(.id != "CodeReviewID")
                  | select(.id != "CIIBestPracticesID")
                )))
            )
          ' results.normalized.sarif > results.filtered.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.filtered.sarif
          retention-days: 5

      - name: Upload SARIF results
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.filtered.sarif
          category: scorecard

  dependency-review:
    name: Dependency Review
    # Reviews the pull-request dependency diff; other events have no diff.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true

  cflite-pr:
    name: ClusterFuzzLite PR fuzzing
    # Code-change fuzzing needs a pull-request diff.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      # ClusterFuzzLite reads earlier run artifacts and uploads its SARIF.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers (address)
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # 2024-09-19
        with:
          language: rust
          github-token: ${{ github.token }}
          sanitizer: address

      - name: Run fuzzers (address)
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # 2024-09-19
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
          output-sarif: true
